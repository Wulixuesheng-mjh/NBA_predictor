[project]
name = "nba-predictor-ml"
version = "0.1.0"
description = "NBA sports lottery prediction - ML module"
requires-python = ">=3.11"
dependencies = [
    "xgboost>=2.1.0",
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "optuna>=3.6.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]
