[project]
name = "nba-predictor-backend"
version = "0.1.0"
description = "NBA sports lottery prediction platform - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "apscheduler>=3.10.0",
    "nba_api>=1.4.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "kagglehub>=1.0",
    # ML inference dependencies (for prediction service)
    "xgboost>=2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    # SHAP explainability (~500MB with numba/llvmlite, but needed for per-prediction explanations)
    "shap>=0.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]
explain = [
    # shap is now a core dependency (needed for per-prediction explanations in API)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
